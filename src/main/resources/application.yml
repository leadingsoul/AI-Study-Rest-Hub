server:
  port: 8080
spring:
  datasource:
    driver-class-name: ${leadingsoul.datasource.driver-class-name}
    type: ${leadingsoul.datasource.type}
    url: ${leadingsoul.datasource.url}
    username: ${leadingsoul.datasource.username}
    password: ${leadingsoul.datasource.password}
    hikari:
      connection-test-query: SELECT 1 # 自动检测连接
      connection-timeout: 60000 #数据库连接超时时间,默认30秒
      idle-timeout: 500000 #空闲连接存活最大时间，默认600000（10分钟）
      max-lifetime: 540000 #此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
      maximum-pool-size: 12 #连接池最大连接数，默认是10
      minimum-idle: 10 #最小空闲连接数量
      pool-name: SPHHikariPool # 连接池名称
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  data:
    redis:
      host: ${leadingsoul.data.redis.host}
      port: ${leadingsoul.data.redis.port}
      database: ${leadingsoul.data.redis.database}
  application:
    name: AI_Study_Rest_Hub
  ai:
    openai:
      api-key: ${leadingsoul.ai.openai.api-key}
      base-url: ${leadingsoul.ai.openai.base-url}
      chat:
        options:
          model: ${leadingsoul.ai.openai.chat.options.model}
          temperature: ${leadingsoul.ai.openai.chat.options.temperature}
          max-tokens: ${leadingsoul.ai.openai.chat.options.max-tokens}
          top-p: ${leadingsoul.ai.openai.chat.options.top-p}
          top-k: ${leadingsoul.ai.openai.chat.options.top-k}
          FrequencyPenalty: ${leadingsoul.ai.openai.chat.options.FrequencyPenalty}
          ThinkingBudget: ${leadingsoul.ai.openai.chat.options.ThinkingBudget}
springdoc:
  default-flat-param-object: true
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值(默认为 1)
      logic-not-delete-value: 0 # 逻辑未删除值(默认为 0)
minio:
  endpoint: ${minio.endpoint}
  access-key: ${minio.access-key}
  secret-key: ${minio.secret-key}
  bucket-name: ${minio.bucket-name}